name: flowcast-remote
services:
  hub:
    build:
      context: ..
      dockerfile: remote/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      FLOWCAST_REMOTE_PUBLIC_URL: ${FLOWCAST_REMOTE_PUBLIC_URL:?Set public HTTPS origin}
      FLOWCAST_REMOTE_ACCESS_KEY: ${FLOWCAST_REMOTE_ACCESS_KEY:?Set access key}
      FLOWCAST_STUN_URLS: ${FLOWCAST_STUN_URLS:-}
      FLOWCAST_TURN_URLS: ${FLOWCAST_TURN_URLS:-}
      FLOWCAST_TURN_SECRET: ${FLOWCAST_TURN_SECRET:?Set TURN secret}
      FLOWCAST_RELAY_ONLY: ${FLOWCAST_RELAY_ONLY:-0}
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  https:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      FLOWCAST_REMOTE_DOMAIN: ${FLOWCAST_REMOTE_DOMAIN:?Set service domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  turn:
    image: coturn/coturn:4
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --external-ip=${FLOWCAST_TURN_PUBLIC_IP:?Set public IPv4}
      - --min-port=49160
      - --max-port=49200
      - --realm=${FLOWCAST_REMOTE_DOMAIN:?Set service domain}
      - --use-auth-secret
      - --static-auth-secret=${FLOWCAST_TURN_SECRET:?Set TURN secret}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-tcp-relay
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --log-file=stdout
      - --simple-log
volumes:
  caddy_data:
  caddy_config:
